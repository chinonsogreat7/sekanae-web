services:
  - type: web
    name: sekanae-web
    runtime: static
    autoDeployTrigger: off
    domains:
      - sekanae.co
      - www.sekanae.co
    buildCommand: npm ci && npm run build
    staticPublishPath: ./dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_URL
        value: https://sekanae-api.onrender.com

  - type: web
    name: sekanae-api
    runtime: node
    plan: free
    autoDeployTrigger: off
    buildCommand: npm ci && npm run api:build
    preDeployCommand: npm run db:migrate && npm run db:seed
    startCommand: npm run api:start
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        sync: false
      - key: API_PUBLIC_URL
        value: https://sekanae-api.onrender.com
      - key: ADMIN_API_KEY
        sync: false
      - key: RESEND_API_KEY
        sync: false
      - key: EMAIL_FROM
        sync: false
      - key: ADMIN_EMAIL
        sync: false
      - key: ADMIN_LOGIN_EMAIL
        sync: false
      - key: ADMIN_PASSWORD_HASH
        sync: false
      - key: STRIPE_SECRET_KEY
        sync: false
      - key: STRIPE_WEBHOOK_SECRET
        sync: false
      - key: STRIPE_SUCCESS_URL
        sync: false
      - key: STRIPE_CANCEL_URL
        sync: false
      - key: DEFAULT_CURRENCY
        value: EUR
      - key: DEFAULT_MARKET_COUNTRY
        value: MT
      - key: DEFAULT_SHIPPING_AMOUNT
        value: "0"
      - key: VAT_RATE
        value: "0.18"
      - key: VAT_INCLUDED
        value: "true"
      - key: WEB_ORIGIN
        sync: false
