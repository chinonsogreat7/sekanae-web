services:
  - type: web
    name: sekanae-web
    runtime: static
    branch: main
    autoDeployTrigger: commit
    domains:
      - sekanae.co
      - www.sekanae.co
    buildCommand: npm ci --include=dev && npm run build
    staticPublishPath: ./dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_URL
        value: https://sekanae-api.onrender.com

  - type: web
    name: sekanae-api
    runtime: node
    plan: free
    branch: main
    autoDeployTrigger: commit
    buildCommand: npm ci --include=dev && npm run api:build
    preDeployCommand: npm run db:migrate && npm run db:seed
    startCommand: npm run api:start:migrated
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        sync: false
      - key: API_PUBLIC_URL
        value: https://sekanae-api.onrender.com
      - key: ADMIN_API_KEY
        sync: false
      - key: RESEND_API_KEY
        sync: false
      - key: EMAIL_FROM
        sync: false
      - key: ADMIN_EMAIL
        sync: false
      - key: ADMIN_LOGIN_EMAIL
        sync: false
      - key: ADMIN_PASSWORD_HASH
        sync: false
      - key: STRIPE_SECRET_KEY
        sync: false
      - key: STRIPE_WEBHOOK_SECRET
        sync: false
      - key: STRIPE_SUCCESS_URL
        value: https://sekanae.co/checkout/success?session_id={CHECKOUT_SESSION_ID}
      - key: STRIPE_CANCEL_URL
        value: https://sekanae.co/cart
      - key: CLOUDINARY_CLOUD_NAME
        sync: false
      - key: CLOUDINARY_API_KEY
        sync: false
      - key: CLOUDINARY_API_SECRET
        sync: false
      - key: CLOUDINARY_UPLOAD_FOLDER
        value: sekanae/products
      - key: DEFAULT_CURRENCY
        value: EUR
      - key: DEFAULT_MARKET_COUNTRY
        value: MT
      - key: DEFAULT_SHIPPING_AMOUNT
        value: "0"
      - key: VAT_RATE
        value: "0.18"
      - key: VAT_INCLUDED
        value: "true"
      - key: WEB_ORIGIN
        value: https://sekanae.co

  - type: cron
    name: sekanae-cart-reminders
    runtime: node
    branch: main
    schedule: "0 * * * *"
    buildCommand: npm ci --include=dev && npm run api:build
    startCommand: npm run api:cart-reminders
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        sync: false
      - key: API_PUBLIC_URL
        value: https://sekanae-api.onrender.com
      - key: WEB_ORIGIN
        value: https://sekanae.co
      - key: RESEND_API_KEY
        sync: false
      - key: EMAIL_FROM
        sync: false
      - key: DEFAULT_CURRENCY
        value: EUR
      - key: DEFAULT_MARKET_COUNTRY
        value: MT
      - key: DEFAULT_SHIPPING_AMOUNT
        value: "0"
      - key: VAT_RATE
        value: "0.18"
      - key: VAT_INCLUDED
        value: "true"
